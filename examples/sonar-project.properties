# Exemplo de configuração do SonarScanner.
# Copie para a raiz do projeto analisado como "sonar-project.properties".
# A chave (sonar.projectKey) deve ser única no SonarQube.

sonar.projectKey=minha-api
sonar.projectName=Minha API
sonar.projectVersion=1.0.0

# Fontes e testes
sonar.sources=src
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Exclusões (ajuste conforme a stack)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.min.js,**/coverage/**
sonar.coverage.exclusions=**/test/**,**/*.spec.ts

# Relatório de cobertura (exemplo para Jest/LCOV)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
